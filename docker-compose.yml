services:
  uptime_bot:
    container_name: deltachat_uptime_bot
    build: .
    init: true
    restart: unless-stopped
    # Up to 200 checks run at once (CHECK_CONCURRENCY), plus idle keep-alive connections;
    # Docker's default of 1024 open files would leave little headroom
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./data/uptimebot:/root/.config/uptimebot
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DC_DB_DIR=/app/data
      - DB_PATH=/app/data/uptime.db
      - DISPLAY_NAME
      - STATUS_TEXT
      - AVATAR_PATH
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
